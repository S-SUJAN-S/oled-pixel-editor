<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Binary Pixel Editor</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --workspace-bg: #121214;
            --ui-bg: rgba(20, 20, 25, 0.85);
            --text-color: #f0f0f0;
            --text-dim: #94a3b8;
            --accent-color: #10b981;
            --selection-color: #3b82f6;
            --border-color: rgba(255, 255, 255, 0.1);
            --pixel-on: #ffffff;
            --pixel-off: #1e1e22;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1a20 0%, #0a0a0c 100%);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        #editor-container {
            flex: 1;
            position: relative;
            cursor: crosshair;
            overflow: hidden;
            touch-action: none;
        }

        #canvas-element {
            image-rendering: pixelated;
            display: block;
        }

        .ui-overlay {
            position: absolute;
            pointer-events: none;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .ui-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .glass-panel {
            background: var(--ui-bg);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 4px;
        }

        .stats {
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            padding: 0 10px;
        }

        .stats b { color: var(--text-color); }

        button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
        }

        button.active {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-color);
            border-color: rgba(16, 185, 129, 0.3);
        }

        button.primary {
            background: var(--accent-color);
            color: #000;
        }

        button.primary:hover {
            background: #34d399;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 4px;
        }

        .hint-bar {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            text-align: center;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.02em;
        }

        #import-input { display: none; }

        /* Animation for selection */
        @keyframes marching-ants {
            0% { line-dash-offset: 0; }
            100% { line-dash-offset: 10; }
        }
    </style>
</head>
<body>

    <div id="editor-container">
        <div class="ui-overlay">
            <div style="display: flex; justify-content: space-between; width: 100%; pointer-events: none;">
                <div class="glass-panel">
                    <div class="toolbar-group">
                        <button id="btn-pencil" class="active" onclick="setTool('pencil')" title="Pencil (P)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                            Pencil
                        </button>
                        <button id="btn-select" onclick="setTool('select')" title="Selection (S)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" stroke-dasharray="4 4"/></svg>
                            Select
                        </button>
                    </div>
                    <div class="divider"></div>
                    <div class="toolbar-group">
                        <button onclick="undo()" title="Undo (Ctrl+Z)">Undo</button>
                        <button onclick="redo()" title="Redo (Ctrl+Y)">Redo</button>
                    </div>
                    <span class="stats" id="history-label">Steps: 0</span>
                </div>
                
                <div class="glass-panel">
                    <span class="stats">Zoom: <b id="zoom-value">100</b>%</span>
                    <div class="divider"></div>
                    <button onclick="fitToScreen()">Center View</button>
                </div>
            </div>

            <div class="glass-panel" style="align-self: flex-start;">
                <button onclick="exportPNG()">Export PNG</button>
                <button onclick="exportCSV()">Export CSV</button>
                <button onclick="triggerImport()">Import CSV</button>
                <input type="file" id="import-input" accept=".csv" onchange="handleImport(event)">
            </div>
        </div>

        <div class="hint-bar">
            <b>S</b> Select • <b>P</b> Pencil • <b>Ctrl+Z/Y</b> Undo/Redo • <b>Alt+Drag</b> Duplicate • <b>Del</b> Clear
        </div>

        <canvas id="canvas-element"></canvas>

        <div class="ui-bottom">
            <div class="glass-panel" style="padding: 8px 16px;">
                <button onclick="clearCanvas()" style="color: #ef4444;">Clear All</button>
                <div class="divider"></div>
                <span class="stats" id="selection-status">No selection active</span>
            </div>
        </div>
    </div>

    <script>
        const COLS = 128;
        const ROWS = 64;
        
        const canvas = document.getElementById('canvas-element');
        const ctx = canvas.getContext('2d', { alpha: false });
        const container = document.getElementById('editor-container');
        const zoomDisplay = document.getElementById('zoom-value');
        const historyLabel = document.getElementById('history-label');
        const selectionStatus = document.getElementById('selection-status');

        // Main State
        let pixels = new Uint8Array(COLS * ROWS);
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;

        // Tool State
        let currentTool = 'pencil';
        let isDrawing = false;
        let isPanning = false;
        let isSelecting = false;
        let isMovingSelection = false;
        let drawMode = 1;
        
        // Selection State
        let selection = { x: 0, y: 0, w: 0, h: 0, active: false };
        let selectionBuffer = null; 
        let dragStart = { x: 0, y: 0 };
        let marqueeStart = { x: 0, y: 0 };

        // History
        let undoStack = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        // Clipboard
        let clipboard = null;

        function init() {
            window.addEventListener('resize', handleResize);
            container.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            container.addEventListener('wheel', onWheel, { passive: false });
            window.addEventListener('keydown', onKeyDown);
            container.addEventListener('contextmenu', e => e.preventDefault());

            handleResize();
            fitToScreen();
            saveState(); 
            requestAnimationFrame(render);
        }

        // --- Core Logic ---

        function setTool(tool) {
            currentTool = tool;
            document.getElementById('btn-pencil').classList.toggle('active', tool === 'pencil');
            document.getElementById('btn-select').classList.toggle('active', tool === 'select');
            if (tool === 'pencil') cancelSelection();
        }

        function saveState() {
            const last = undoStack[undoStack.length - 1];
            if (last && arraysEqual(last, pixels)) return;

            undoStack.push(new Uint8Array(pixels));
            if (undoStack.length > MAX_HISTORY) undoStack.shift();
            redoStack = [];
            updateHistoryUI();
        }

        function arraysEqual(a, b) {
            for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
            return true;
        }

        function undo() {
            if (undoStack.length > 1) {
                redoStack.push(undoStack.pop());
                pixels = new Uint8Array(undoStack[undoStack.length - 1]);
                cancelSelection();
                updateHistoryUI();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const state = redoStack.pop();
                pixels = new Uint8Array(state);
                undoStack.push(state);
                cancelSelection();
                updateHistoryUI();
            }
        }

        function updateHistoryUI() {
            historyLabel.textContent = `Steps: ${undoStack.length - 1}`;
        }

        // --- Interaction ---

        function onMouseDown(e) {
            const isMiddle = e.button === 1;
            const isCtrl = e.ctrlKey && e.button === 0;
            const coord = getPixelCoord(e.clientX, e.clientY);

            if (isMiddle || isCtrl) {
                isPanning = true;
                dragStart = { x: e.clientX, y: e.clientY };
                return;
            }

            if (e.button === 0) {
                if (currentTool === 'pencil') {
                    isDrawing = true;
                    if (isValid(coord.x, coord.y)) {
                        drawMode = pixels[coord.y * COLS + coord.x] === 1 ? 0 : 1;
                        togglePixel(coord.x, coord.y, drawMode);
                        dragStart = coord;
                    }
                } else if (currentTool === 'select') {
                    if (selection.active && coord.x >= selection.x && coord.x < selection.x + selection.w && coord.y >= selection.y && coord.y < selection.y + selection.h) {
                        startMovingSelection(e.altKey);
                        dragStart = coord;
                    } else {
                        cancelSelection();
                        isSelecting = true;
                        marqueeStart = coord;
                        selection = { x: coord.x, y: coord.y, w: 0, h: 0, active: false };
                    }
                }
            }
        }

        function onMouseMove(e) {
            const coord = getPixelCoord(e.clientX, e.clientY);

            if (isPanning) {
                offsetX += e.clientX - dragStart.x;
                offsetY += e.clientY - dragStart.y;
                dragStart = { x: e.clientX, y: e.clientY };
                return;
            }

            if (isDrawing) {
                if (isValid(coord.x, coord.y)) {
                    bresenham(dragStart.x, dragStart.y, coord.x, coord.y, drawMode);
                    dragStart = coord;
                }
            }

            if (isSelecting) {
                const x1 = Math.max(0, Math.min(COLS - 1, marqueeStart.x));
                const y1 = Math.max(0, Math.min(ROWS - 1, marqueeStart.y));
                const x2 = Math.max(0, Math.min(COLS - 1, coord.x));
                const y2 = Math.max(0, Math.min(ROWS - 1, coord.y));
                selection.x = Math.min(x1, x2);
                selection.y = Math.min(y1, y2);
                selection.w = Math.abs(x1 - x2) + 1;
                selection.h = Math.abs(y1 - y2) + 1;
                selection.active = true;
            }

            if (isMovingSelection) {
                const dx = coord.x - dragStart.x;
                const dy = coord.y - dragStart.y;
                if (dx !== 0 || dy !== 0) {
                    selection.x += dx;
                    selection.y += dy;
                    dragStart = coord;
                }
            }
            updateSelectionStatus();
        }

        function onMouseUp() {
            if (isDrawing) saveState();
            if (isMovingSelection) { commitSelection(); saveState(); }
            isDrawing = false;
            isPanning = false;
            isSelecting = false;
            isMovingSelection = false;
        }

        function onKeyDown(e) {
            const key = e.key.toLowerCase();
            const ctrl = e.ctrlKey || e.metaKey;
            if (key === 'p') setTool('pencil');
            if (key === 's') setTool('select');
            if (ctrl && key === 'z') { e.preventDefault(); undo(); }
            if (ctrl && key === 'y') { e.preventDefault(); redo(); }
            if (key === 'escape') cancelSelection();
            if (key === 'delete' || key === 'backspace') deleteSelection();
            if (ctrl && key === 'c') copySelection();
            if (ctrl && key === 'x') cutSelection();
            if (ctrl && key === 'v') pasteClipboard();
            if (selection.active && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
                e.preventDefault();
                const amt = e.shiftKey ? 8 : 1;
                startMovingSelection();
                if (key === 'arrowup') selection.y -= amt;
                if (key === 'arrowdown') selection.y += amt;
                if (key === 'arrowleft') selection.x -= amt;
                if (key === 'arrowright') selection.x += amt;
                commitSelection();
                saveState();
            }
        }

        // --- Selection ---

        function startMovingSelection(duplicate = false) {
            if (!selection.active || isMovingSelection) return;
            isMovingSelection = true;
            selectionBuffer = new Uint8Array(selection.w * selection.h);
            for (let j = 0; j < selection.h; j++) {
                for (let i = 0; i < selection.w; i++) {
                    const sx = selection.x + i, sy = selection.y + j;
                    if (isValid(sx, sy)) {
                        selectionBuffer[j * selection.w + i] = pixels[sy * COLS + sx];
                        if (!duplicate) pixels[sy * COLS + sx] = 0;
                    }
                }
            }
        }

        function commitSelection() {
            if (!selection.active || !selectionBuffer) return;
            for (let j = 0; j < selection.h; j++) {
                for (let i = 0; i < selection.w; i++) {
                    const tx = selection.x + i, ty = selection.y + j;
                    if (isValid(tx, ty)) pixels[ty * COLS + tx] = selectionBuffer[j * selection.w + i];
                }
            }
            selectionBuffer = null;
        }

        function cancelSelection() {
            if (isMovingSelection) commitSelection();
            selection.active = false;
            selectionBuffer = null;
            updateSelectionStatus();
        }

        function deleteSelection() {
            if (!selection.active) return;
            for (let j = 0; j < selection.h; j++) {
                for (let i = 0; i < selection.w; i++) {
                    const tx = selection.x + i, ty = selection.y + j;
                    if (isValid(tx, ty)) pixels[ty * COLS + tx] = 0;
                }
            }
            selection.active = false;
            saveState();
        }

        function copySelection() {
            if (!selection.active) return;
            const data = new Uint8Array(selection.w * selection.h);
            for (let j = 0; j < selection.h; j++) {
                for (let i = 0; i < selection.w; i++) {
                    const sx = selection.x + i, sy = selection.y + j;
                    data[j * selection.w + i] = isValid(sx, sy) ? pixels[sy * COLS + sx] : 0;
                }
            }
            clipboard = { w: selection.w, h: selection.h, data };
        }

        function cutSelection() { copySelection(); deleteSelection(); }

        function pasteClipboard() {
            if (!clipboard) return;
            cancelSelection();
            selection = { x: 2, y: 2, w: clipboard.w, h: clipboard.h, active: true };
            selectionBuffer = new Uint8Array(clipboard.data);
            commitSelection();
            saveState();
            setTool('select');
        }

        // --- Utils ---

        function handleResize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

        function fitToScreen() {
            const padding = 120;
            const scaleX = (window.innerWidth - padding) / COLS;
            const scaleY = (window.innerHeight - padding) / ROWS;
            scale = Math.floor(Math.min(scaleX, scaleY));
            if (scale < 1) scale = 1;
            offsetX = (window.innerWidth - (COLS * scale)) / 2;
            offsetY = (window.innerHeight - (ROWS * scale)) / 2;
            updateUI();
        }

        function clearCanvas() { pixels.fill(0); cancelSelection(); saveState(); }

        function updateUI() { zoomDisplay.textContent = Math.round(scale * 100); }

        function updateSelectionStatus() {
            selectionStatus.innerHTML = selection.active ? 
                `Selection: <b>${selection.w}x${selection.h}</b> at (${selection.x}, ${selection.y})` : 
                "No selection active";
        }

        function getPixelCoord(clientX, clientY) {
            return { x: Math.floor((clientX - offsetX) / scale), y: Math.floor((clientY - offsetY) / scale) };
        }

        function onWheel(e) {
            e.preventDefault();
            const oldScale = scale;
            if (e.deltaY < 0) scale *= 1.2; else scale /= 1.2;
            scale = Math.max(0.1, Math.min(scale, 150));
            offsetX = e.clientX - (e.clientX - offsetX) * (scale / oldScale);
            offsetY = e.clientY - (e.clientY - offsetY) * (scale / oldScale);
            updateUI();
        }

        function isValid(x, y) { return x >= 0 && x < COLS && y >= 0 && y < ROWS; }

        function togglePixel(x, y, val) { if (isValid(x, y)) pixels[y * COLS + x] = val; }

        function bresenham(x0, y0, x1, y1, val) {
            const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1, sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;
            while (true) {
                togglePixel(x0, y0, val);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) { err -= dy; x0 += sx; }
                if (e2 < dx) { err += dx; y0 += sy; }
            }
        }

        // --- Export/Import ---

        function exportPNG() {
            const temp = document.createElement('canvas');
            temp.width = COLS; temp.height = ROWS;
            const tCtx = temp.getContext('2d');
            const imgData = tCtx.createImageData(COLS, ROWS);
            for (let i = 0; i < pixels.length; i++) {
                const val = pixels[i] === 1 ? 255 : 0;
                const idx = i * 4;
                imgData.data[idx] = val; imgData.data[idx+1] = val; imgData.data[idx+2] = val; imgData.data[idx+3] = 255;
            }
            tCtx.putImageData(imgData, 0, 0);
            const link = document.createElement('a');
            link.download = 'pixel_art.png'; link.href = temp.toDataURL(); link.click();
        }

        function exportCSV() {
            let csvContent = "";
            let tc = COLS, tr = ROWS, sx = 0, sy = 0;
            if (selection.active) { tc = selection.w; tr = selection.h; sx = selection.x; sy = selection.y; }
            for (let y = 0; y < tr; y++) {
                const row = [];
                for (let x = 0; x < tc; x++) row.push(isValid(sx + x, sy + y) ? pixels[(sy + y) * COLS + (sx + x)] : 0);
                csvContent += row.join(",") + "\n";
            }
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const link = document.createElement('a');
            link.download = selection.active ? 'selection.csv' : 'canvas.csv';
            link.href = URL.createObjectURL(blob); link.click();
        }

        function triggerImport() { document.getElementById('import-input').click(); }

        function handleImport(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const rows = event.target.result.trim().split("\n");
                const newPixels = new Uint8Array(COLS * ROWS);
                rows.forEach((rowStr, y) => {
                    if (y >= ROWS) return;
                    const vals = rowStr.split(",");
                    vals.forEach((v, x) => { if (x < COLS) newPixels[y * COLS + x] = parseInt(v) || 0; });
                });
                pixels = newPixels; saveState();
            };
            reader.readAsText(file);
        }

        // --- Render ---

        function render() {
            // Background clearing
            ctx.fillStyle = '#0a0a0c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Workspace background
            ctx.fillStyle = '#121214';
            ctx.fillRect(offsetX, offsetY, COLS * scale, ROWS * scale);

            // DRAW GRID & PIXELS
            const drawGrid = scale >= 3;
            const gap = scale > 5 ? 1 : 0; // Create tile gap at high zoom

            // Optimization: Only draw pixels and grid within the viewable area
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = offsetX + x * scale;
                    const py = offsetY + y * scale;

                    // Draw Pixel Cell (The "OFF" state grid)
                    if (drawGrid) {
                        ctx.fillStyle = '#1e1e22';
                        ctx.fillRect(px + gap, py + gap, scale - gap * 2, scale - gap * 2);
                    }

                    // Draw "ON" state
                    if (pixels[y * COLS + x] === 1) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(px + gap, py + gap, scale - gap * 2, scale - gap * 2);
                        
                        // Add a tiny highlight/glow effect to ON pixels at high zoom
                        if (scale > 10) {
                            ctx.fillStyle = 'rgba(255,255,255,0.1)';
                            ctx.fillRect(px + gap, py + gap, scale - gap * 2, (scale - gap * 2) / 3);
                        }
                    }
                }
            }

            // Selection Preview (Floating layer)
            if (isMovingSelection && selectionBuffer) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                for (let j = 0; j < selection.h; j++) {
                    for (let i = 0; i < selection.w; i++) {
                        if (selectionBuffer[j * selection.w + i] === 1) {
                            ctx.fillRect(offsetX + (selection.x + i) * scale + gap, offsetY + (selection.y + j) * scale + gap, scale - gap * 2, scale - gap * 2);
                        }
                    }
                }
            }

            // Selection Bounds Marquee
            if (selection.active) {
                const time = Date.now() / 100;
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.lineDashOffset = -time % 10;
                ctx.strokeRect(offsetX + selection.x * scale - 1, offsetY + selection.y * scale - 1, selection.w * scale + 2, selection.h * scale + 2);
                ctx.setLineDash([]);
                
                // Outer glow for selection
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.3)';
                ctx.lineWidth = 4;
                ctx.strokeRect(offsetX + selection.x * scale - 2, offsetY + selection.y * scale - 2, selection.w * scale + 4, selection.h * scale + 4);
            }

            // Outer Canvas Boundary
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(offsetX - 1, offsetY - 1, COLS * scale + 2, ROWS * scale + 2);

            requestAnimationFrame(render);
        }

        init();
    </script>
</body>
</html>
